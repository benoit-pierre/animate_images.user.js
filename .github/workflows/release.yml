name: Release

on:
  push:
    tags:
      - v*

jobs:

  release:

    name: Release

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7
        with:
          clean: false
          fetch-depth: 1
          show-progress: false

      - name: Build
        run: make podman-build

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create
          --title '${{ github.ref_name }}'
          --verify-tag '${{ github.ref_name }}'
          'build-podman/build/animate_images.user.js#User script (js)'
